<!-- Other NewsComponent Section -->
<section class="py-5"  id="otherNewsSection">
  <div class="container">
    <h1 class="display-6 fw-bold mb-3 text-center border-bottom">{{ 'news' | translate }}</h1>
    <div class="row">
      @for (news of allNews(); track news.id) {
        <div class="col-md-4">
          <div class="news-card card mb-4">
            <img [src]="news.image" class="card-img-top" alt="">
            <div class="card-body">
              <h2 class="h5 card-title">{{ news.title | localized }}</h2>
              <p class="card-text">{{ news.summary | localized }}</p>
              <small class="text-muted"><time [attr.datetime]="news.date">{{ news.date | localizedDate }}</time></small>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
