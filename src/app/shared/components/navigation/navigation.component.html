<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top" [attr.aria-label]="'nav-main-label' | translate">
  <div class="container">
    <button class="navbar-toggler" type="button"
            aria-controls="main-nav"
            [attr.aria-expanded]="!collapsed()"
            [attr.aria-label]="'nav-toggle' | translate"
            (click)="toggle()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" id="main-nav" [ngbCollapse]="collapsed()">
      <ul class="navbar-nav nav-pills">
        @for (entry of entries; track entry.id) {
          @if (entry.kind === 'link') {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="entry.path" routerLinkActive="active">
                <i class="bi {{ entry.icon }}" aria-hidden="true"></i> {{ entry.labelKey | translate }}
              </a>
            </li>
          } @else {
            <li class="nav-item" ngbDropdown>
              <button type="button" class="nav-link dropdown-toggle" ngbDropdownToggle
                      [class.active]="isActive(entry)">
                <i class="bi {{ entry.icon }}" aria-hidden="true"></i> {{ entry.labelKey | translate }}
              </button>
              <div class="dropdown-menu" ngbDropdownMenu>
                @for (item of entry.items; track item.id) {
                  <a ngbDropdownItem [routerLink]="item.path"
                     routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    <i class="bi {{ item.icon }} me-2" aria-hidden="true"></i>{{ item.labelKey | translate }}
                  </a>
                }
              </div>
            </li>
          }
        }
      </ul>
    </div>
  </div>
</nav>
