<section class="coming-soon py-5">
  <div class="container text-center">
    <i class="bi bi-hourglass-split display-3 text-muted" aria-hidden="true"></i>
    <h1 class="mt-3 mb-2">{{ titleKey() | translate }}</h1>
    <p class="mb-3"><span class="badge bg-secondary-dark text-white">{{ 'coming-soon-title' | translate }}</span></p>
    <p class="lead text-muted mb-4">{{ 'coming-soon-text' | translate }}</p>
    <a class="btn btn-outline-primary" [routerLink]="backPath()">
      <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
      {{ 'back-to' | translate }} {{ backLabelKey() | translate }}
    </a>
  </div>
</section>
