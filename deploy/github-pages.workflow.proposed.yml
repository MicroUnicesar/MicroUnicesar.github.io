# PROPUESTA, INACTIVA. Está fuera de .github/ a propósito: GitHub solo ejecuta los workflows de .github/workflows.
#
# Es la versión mejorada del workflow que ya existe en la rama `github-pages`
# (.github/workflows/deploy.yml). Para aplicarla: copiarla a esa rama como .github/workflows/deploy.yml.
#
# Qué cambia respecto al actual:
#   1. Node 22 (Angular 20.1 pide Node ^20.19 || ^22.12 || >=24; "20" a secas depende de qué 20.x resuelva).
#   2. Se elimina el paso "Copy index.html to 404.html": ahora `npm run build` ya crea un 404.html correcto
#      (el cascarón del cliente). Ese paso lo sobrescribiría con la portada prerenderizada.
#   3. Se comprueban antes de compilar las traducciones y los scripts de verificación (rápido, sin navegador).
#   4. `npm run build` ejecuta solo el postbuild, que FALLA si alguna página se prerenderizó vacía o sin
#      título/descripción/canonical, o si una redirección apunta a una página inexistente. Así no se
#      publica un sitio vacío aunque el build de Angular "termine bien".
#   5. Se puede lanzar a mano (workflow_dispatch) y se declara el entorno `github-pages` con su URL.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - github-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check translations and scripts
        run: npm run i18n:check && npm run test:scripts

      - name: Build (prerender + SEO files + verification)
        run: npm run build -- --base-href /
        env:
          SITE_URL: https://microunicesar.github.io

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/webpage-micro-unicesar/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
